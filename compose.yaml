name: tg-drop

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:8787:8787'
    env_file: /etc/tg-drop.env
    volumes:
      - /srv/tg-drop/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
